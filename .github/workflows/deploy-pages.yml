name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # First day of each month at 09:00 UTC — refresh cppreference docs
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download cppreference archive
        run: |
          # Try the latest monthly release, fall back to a known-good version
          VERSION=$(date +%Y%m%d)
          URL="https://github.com/PeterFeicht/cppreference-doc/releases/download/v${VERSION}/html-book-${VERSION}.tar.xz"
          FALLBACK="https://github.com/PeterFeicht/cppreference-doc/releases/download/v20250209/html-book-20250209.tar.xz"

          echo "Trying $URL"
          if curl -sfL "$URL" -o cppref.tar.xz; then
            echo "Downloaded latest version v${VERSION}"
          else
            echo "Latest not available, falling back to v20250209"
            curl -sL "$FALLBACK" -o cppref.tar.xz
          fi

          mkdir -p extract
          tar xf cppref.tar.xz -C extract
          echo "Extracted $(find extract -name '*.html' | wc -l) HTML files"

      - name: Build search index and strip pages
        run: |
          python3 scripts/build_index.py extract/reference/en site_output
          # Update the bundled index used by the Python package
          cp site_output/index.json cppmanlite/data/index.json

      - name: Assemble static site
        run: |
          mkdir -p _site
          cp site/index.html site/style.css site/app.js _site/
          cp site_output/index.json _site/
          cp -r site_output/docs _site/docs
          # cppreference pages reference images with RELATIVE paths like
          # "../../../../common/images/7/7c/foo.svg". In the source archive the
          # page is reference/en/<n dirs>/page.html and the image is
          # reference/common/images/..., so N levels up reaches reference/ and
          # the ref resolves. Our build strips "en/" so the page lands at
          # _site/docs/<n dirs>/page.html — the same N-levels-up ref now resolves
          # to the _site/ root. Ship the archive's common/ dir there (images,
          # fonts, css) so every relative ref resolves to a real local file
          # (self-contained; the upload.cppreference.com CDN 404s static reqs).
          if [ -d extract/reference/common ]; then
            cp -r extract/reference/common _site/common
          else
            echo "WARNING: extract/reference/common not found — page images will 404"
          fi
          echo "Site contents:"
          du -sh _site/
          du -sh _site/docs/
          du -sh _site/common/ 2>/dev/null || true
          ls -lh _site/index.json

      - name: Create .nojekyll
        run: touch _site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages

      - name: Commit updated index to repo
        # Runs on every build (push + schedule + manual). Keeps the package's
        # bundled cppmanlite/data/index.json in lockstep with the deployed site,
        # so `pip install cppmanlite` picks up a fresh index immediately. The
        # "[skip ci]" tag means the bot's own push does not re-trigger this
        # workflow (no push loop), and `git diff --staged --quiet` means it's a
        # no-op push when the index didn't change.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cppmanlite/data/index.json
          git diff --staged --quiet || git commit -m "chore: update search index [skip ci]"
          git push
